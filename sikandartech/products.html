<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Shop | SikandarTech</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://sikandartech.com/shop/">
  <script>
    var q = new URLSearchParams(location.search), c = q.get("cat"); q.delete("cat");
    var s = q.toString();
    location.replace((c && /^[a-z0-9-]+$/.test(c) ? "category/" + c + "/" : "shop/") + (s ? "?" + s : "") + location.hash);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=shop/"></noscript>
</head>
<body><p><a href="shop/">Continue to the SikandarTech shop</a></p></body>
</html>
